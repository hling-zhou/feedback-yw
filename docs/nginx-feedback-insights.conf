# Feedback Insights — Nginx 站点配置模板（实际拓扑：81 入口 + 3003 MCP）
#
# 拓扑：
#   浏览器 ──HTTP──▶ :81 Nginx ──▶ dist/ 静态前端
#                          ├─▶ /api/*      → 127.0.0.1:3001（Fastify API）
#                          └─▶ /sse /messages → 127.0.0.1:3003（MCP Server，SSE）
#
# 部署三步：
#   1. 按服务器实际路径调整下方 root（dist 构建产物目录）
#   2. 备份现有配置后替换：cp <现有配置> <现有配置>.bak-$(date +%F)
#   3. nginx -t && nginx -s reload
#
# 部署后验证（在服务器执行）：
#   curl -sI http://127.0.0.1:81/index.html | grep -i cache               # 期望 no-cache
#   curl -sI http://127.0.0.1:81/assets/index-xxx.js | grep -i cache      # 期望 max-age=31536000, immutable
#   curl -s http://127.0.0.1:3001/health                                   # API 健康直连（/health 不经 Nginx，勿走 :81/api/health——404）
#   curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:81/api/auth/me  # 期望 401（无 token 亦 401，证明 Nginx→API 链路通）
#   curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:81/evidence-rows.json  # 期望 403（流水线产物拒绝外发）
#   curl -sN http://127.0.0.1:81/sse                                       # 期望 MCP 握手事件流（Bearer 按 Agent 配置）

server {
  listen 81;
  # 部署实况（YUNWANG-SEALER-TEST-09 /etc/nginx/conf.d/feedback.conf）
  server_name 10.64.3.250;

  # 部署实况路径（如迁移目录请同步修改）
  root /liyujia/feedback-yw/dist;
  index index.html;
  # 与生产现值一致（Excel/CSV 导入若报 413 可上调）
  client_max_body_size 20m;

  # ---- 静态前端：三层缓存策略（缺一不可） -------------------------------
  # 1. Vite 指纹产物（assets/）：文件名含内容 hash，发版即改名 → 放心永久缓存
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 2. SPA 入口：每次使用前向服务器协商验证（304 秒回），
  #    绝不让浏览器/代理自作主张把 index.html 缓存数日
  #    （「发版后同事看到的还是旧版、手动清缓存才恢复」即此层缺失的后果）
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # 3. SPA fallback 路由与其余静态文件（含 /config/*——不带 hash 且会被
  #    「发布」API 运行时更新，同样禁长缓存）
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # 流水线产物双保险：postbuild 已清理 dist/ 根下这些文件，
  # 历史遗留或手动拉回的产物在此兜底拒绝外发（内含逐工单归因数据）
  location ~ ^/(evidence-rows|gate-report|taxonomy-current|pipeline-summary)\.json$ {
    deny all;
  }

  # ---- API → Fastify(3001) ----------------------------------------------
  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- MCP Server → 3003（SSE）-------------------------------------------
  # SSE 端点只能挂根路径：/sse 握手时服务端下发相对 endpoint /messages?sessionId=...，
  # 挂子路径（如 /mcp/sse）会导致 POST 404
  location /sse {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;          # SSE 关键：禁缓冲，否则事件被 Nginx 攒住不吐
    proxy_read_timeout 10m;       # 对齐服务端 10 分钟会话超时（30s 心跳保活）
  }
  location /messages {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
  }
}
